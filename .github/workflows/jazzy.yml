name: ROS 2 Jazzy
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/nav2_ec_dwvp_controller
      - name: Dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep
          test -f /etc/ros/rosdep/sources.list.d/20-default.list || rosdep init
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -r -y
      - name: Build and test
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: '1'
          AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select nav2_ec_dwvp_controller --cmake-args -DBUILD_TESTING=ON
          source install/setup.bash
          colcon test --packages-select nav2_ec_dwvp_controller --return-code-on-test-failure
          colcon test-result --verbose
