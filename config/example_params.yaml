# Merge this controller-only example into a complete ROS 2 Humble Nav2 configuration.
controller_server:
  ros__parameters:
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: false
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.3
    FollowPath:
      plugin: "nav2_omnidirectional_dwvp_controller::OmnidirectionalDWVPController"
      desired_linear_vel: 0.32
      max_vel_x: 0.22
      min_vel_x: -0.22
      max_vel_y: 0.22
      min_vel_y: -0.22
      max_vel_theta: 0.6
      min_vel_theta: -0.6
      max_accel_x: 0.22
      max_accel_y: 0.22
      max_accel_theta: 0.6
      vp_translation_speed: 0.0  # <= 0: inscribed planar speed
      # When enabled, choose tau >= max(v / (2 a_y), sigma_xy / (a_y dt)).
      # Example: 0.75 s for v=0.22 m/s, a_y=0.22 m/s^2, sigma_xy=0.005 m, dt=1/30 s.
      lateral_time_constant: 0.0  # seconds; <= 0 preserves the original VP law
      orientation_time_weight: 1.0
      min_orientation_time: 0.2
      velocity_feedback: "OPEN_LOOP"
      use_dynamic_window_vector_pursuit: true
      use_uniform_velocity_scaling: false  # VP_SCALED: set this true and DWVP false
      lookahead_dist: 0.11
      min_lookahead_dist: 0.11
      max_lookahead_dist: 0.33
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      use_interpolation: true
      transform_tolerance: 0.1
      use_regulated_linear_velocity_scaling: false  # PP curvature heuristic is not used
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0  # must match the costmap inflation layer
      regulated_linear_scaling_min_speed: 0.05
      approach_velocity_scaling_dist: 0.6
      min_approach_linear_velocity: 0.05
      use_collision_detection: true
      use_collision_detection_for_omni: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      enable_csv_logging: false
      csv_log_directory: "/tmp"
      csv_filename_prefix: "dwvp_log"
      csv_pose_frame: "map"
