# Experiment 1b: Clipped VP, Scaled VP and EC-DWVP on a 2.5 m straight path.
# Path orientation changes from 0 to 90 deg over x = 1.0 to 1.3 m.
# Initial pose error is zero. Path point spacing is 0.01 m.
# Lookahead time 0.75 s, distance bounds 0.11 to 0.33 m.
# Lateral compensation is disabled (lateral_time_constant=0).
# Acceleration limits: x/y = 0.055 m/s^2, angular = 0.15 rad/s^2.
# Collision projection and cost-based speed regulation were disabled.
# Merge these controller-server, velocity-smoother and local-costmap settings
# into a complete ROS 2 Jazzy Nav2 configuration. Topics and frames are those
# of the HSR experiment. Select a controller through FollowPath.controller_id.
# Five trials were recorded for each method and condition.
# Controllers are loaded directly instead of through the timing-only wrapper.
# VP demand is 0.22 m/s: vp_translation_speed=0 selects the inscribed axis limit.
# desired_linear_vel=0.32 is the separate regulation setting used in the runs.

controller_server:
  ros__parameters:
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /omni_base_controller/wheel_odom
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - VP_CLIP
    - VP_SCALED
    - EC_DWVP
    speed_limit_topic: speed_limit
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    general_goal_checker:
      stateful: false
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.3
    progress_checker_plugin: progress_checker
    controller_frequency: 30.0
    VP_CLIP:
      plugin: nav2_ec_dwvp_controller::ECDWVPController
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: false
      orientation_time_weight: 1.0
      lateral_time_constant: 0.0
      min_orientation_time: 0.2
      velocity_feedback: OPEN_LOOP
      use_dynamic_window_vector_pursuit: false
      use_collision_detection_for_omni: false
      enable_csv_logging: false
      use_cost_regulated_linear_velocity_scaling: false
      use_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_speed: 0.05
      approach_velocity_scaling_dist: 0.6
      min_approach_linear_velocity: 0.05
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      lookahead_time: 0.75
      min_lookahead_dist: 0.11
      max_lookahead_dist: 0.33
      lookahead_dist: 0.11
      max_angular_accel: 0.15
      desired_linear_vel: 0.32
      vp_translation_speed: 0.0
      max_vel_x: 0.22
      min_vel_x: -0.22
      max_accel_x: 0.055
      max_vel_y: 0.22
      min_vel_y: -0.22
      max_accel_y: 0.055
      max_vel_theta: 0.6
      min_vel_theta: -0.6
      max_accel_theta: 0.15
    VP_SCALED:
      plugin: nav2_ec_dwvp_controller::ECDWVPController
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: false
      orientation_time_weight: 1.0
      lateral_time_constant: 0.0
      min_orientation_time: 0.2
      velocity_feedback: OPEN_LOOP
      use_dynamic_window_vector_pursuit: false
      use_uniform_velocity_scaling: true
      use_collision_detection_for_omni: false
      enable_csv_logging: false
      use_cost_regulated_linear_velocity_scaling: false
      use_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_speed: 0.05
      approach_velocity_scaling_dist: 0.6
      min_approach_linear_velocity: 0.05
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      lookahead_time: 0.75
      min_lookahead_dist: 0.11
      max_lookahead_dist: 0.33
      lookahead_dist: 0.11
      max_angular_accel: 0.15
      desired_linear_vel: 0.32
      vp_translation_speed: 0.0
      max_vel_x: 0.22
      min_vel_x: -0.22
      max_accel_x: 0.055
      max_vel_y: 0.22
      min_vel_y: -0.22
      max_accel_y: 0.055
      max_vel_theta: 0.6
      min_vel_theta: -0.6
      max_accel_theta: 0.15
    EC_DWVP:
      plugin: nav2_ec_dwvp_controller::ECDWVPController
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: false
      orientation_time_weight: 1.0
      lateral_time_constant: 0.0
      min_orientation_time: 0.2
      velocity_feedback: OPEN_LOOP
      use_dynamic_window_vector_pursuit: true
      use_collision_detection_for_omni: false
      enable_csv_logging: false
      use_cost_regulated_linear_velocity_scaling: false
      use_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_speed: 0.05
      approach_velocity_scaling_dist: 0.6
      min_approach_linear_velocity: 0.05
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      lookahead_time: 0.75
      min_lookahead_dist: 0.11
      max_lookahead_dist: 0.33
      lookahead_dist: 0.11
      max_angular_accel: 0.15
      desired_linear_vel: 0.32
      vp_translation_speed: 0.0
      max_vel_x: 0.22
      min_vel_x: -0.22
      max_accel_x: 0.055
      max_vel_y: 0.22
      min_vel_y: -0.22
      max_accel_y: 0.055
      max_vel_theta: 0.6
      min_vel_theta: -0.6
      max_accel_theta: 0.15
velocity_smoother:
  ros__parameters:
    scale_velocities: false
    feedback: OPEN_LOOP
    odom_topic: /omni_base_controller/wheel_odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.5
    max_velocity:
    - 0.22
    - 0.22
    - 0.6
    min_velocity:
    - -0.22
    - -0.22
    - -0.6
    max_accel:
    - 0.055
    - 0.055
    - 0.15
    max_decel:
    - -0.055
    - -0.055
    - -0.15
    smoothing_frequency: 30.0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins:
      - static_layer
      - voxel_layer
      - inflation_layer
      filters:
      - keepout_filter
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: false
        filter_info_topic: keepout_costmap_filter_info
        override_lethal_cost: true
        lethal_override_cost: 200
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        combination_method: 1
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
      introspection_mode: disabled
